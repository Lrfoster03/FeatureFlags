name: Chromatic

on: push

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:8080
      COMPOSE_FILE: docker-compose.yml:.github/compose.smoke.yml
      COMPOSE_PROJECT_NAME: featureflags-chromatic
      POSTGRES_PASSWORD: chromatic-postgres-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install visual test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start app and database
        run: docker compose up --build --detach postgres featureflags

      - name: Wait for app
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run Playwright visual tests
        run: npm run test:visual

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          if-no-files-found: ignore

      - name: Stop app and database
        if: always()
        run: docker compose down --volumes

  chromatic:
    name: Run Chromatic
    needs: playwright
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install visual test dependencies
        run: npm ci

      - name: Download Playwright test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ./test-results

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        env:
          CHROMATIC_ARCHIVE_LOCATION: ./test-results
