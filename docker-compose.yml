services:
  featureflags:
    image: ghcr.io/lrfoster03/featureflags:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__KnownProxies__0: ${CADDY_PROXY_IP:-172.30.88.2}
      InvitationEmail__PublicBaseUrl: ${InvitationEmail__PublicBaseUrl:-}
      InvitationEmail__From: ${InvitationEmail__From:-}
      InvitationEmail__Host: ${InvitationEmail__Host:-}
      InvitationEmail__Port: ${InvitationEmail__Port:-587}
      InvitationEmail__Security: ${InvitationEmail__Security:-StartTls}
      InvitationEmail__Username: ${InvitationEmail__Username:-}
      InvitationEmail__Password: ${InvitationEmail__Password:-}
      ConnectionStrings__FeatureFlags: Host=postgres;Port=5432;Database=featureflags;Username=featureflags;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Application: Host=postgres;Port=5432;Database=featureflags;Username=featureflags;Password=${POSTGRES_PASSWORD}
    networks:
      default:
      proxy:
        ipv4_address: ${APP_PROXY_IP:-172.30.88.3}
    expose:
      - "8080"
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: featureflags
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: featureflags
    volumes:
      - postgres-data:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - featureflags
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.88.2}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  dataprotection-keys:

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.88.0/24}
